<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barberia Romana - Tessera & Abbonamenti</title>
    <!-- Configurazione PWA per installare l'app sulla Home del telefono -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Barberia Romana">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes whiteGlow {
            0%, 100% { text-shadow: 0 0 12px rgba(255, 255, 255, 0.25), 0 0 24px rgba(255, 255, 255, 0.08); }
            50% { text-shadow: 0 0 22px rgba(255, 255, 255, 0.55), 0 0 40px rgba(255, 255, 255, 0.2); }
        }
        .logo-glow {
            animation: whiteGlow 3.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen font-sans flex flex-col justify-between">
    <div id="root" class="w-full"></div>

    <script type="text/babel">
        function App() {
            // Controlla se l'URL contiene i dati di una tessera cliente (?card=...)
            const [sharedCard, setSharedCard] = React.useState(() => {
                const params = new URLSearchParams(window.location.search);
                const cardData = params.get('card');
                if (cardData) {
                    try {
                        const decoded = decodeURIComponent(escape(atob(cardData)));
                        return JSON.parse(decoded);
                    } catch (e) {
                        return null;
                    }
                }
                return null;
            });

            const [pinInput, setPinInput] = React.useState('');
            const [isAuthorized, setIsAuthorized] = React.useState(false);
            const [searchQuery, setSearchQuery] = React.useState('');

            const [newClientName, setNewClientName] = React.useState('');
            const [newClientPhone, setNewClientPhone] = React.useState('');

            const [clients, setClients] = React.useState(() => {
                const saved = localStorage.getItem('barberia_romana_staff_clients');
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) { }
                }
                return [
                    { id: 1, name: "Marco Rossi", phone: "3331234567", stamps: 3, sub: null, lastVisit: "2026-11-01" },
                    { id: 2, name: "Luca Bianchi", phone: "3389876543", stamps: 0, sub: { type: "Silver", used: 2 }, lastVisit: "2026-10-25" },
                ];
            });

            React.useEffect(() => {
                localStorage.setItem('barberia_romana_staff_clients', JSON.stringify(clients));
            }, [clients]);

            const STAFF_PIN = "1893";
            const SHOP_WHATSAPP = "3318610302";

            const handleLogin = (e) => {
                e.preventDefault();
                if (pinInput === STAFF_PIN) {
                    setIsAuthorized(true);
                    setPinInput('');
                } else {
                    alert("PIN errato!");
                    setPinInput('');
                }
            };

            const handleAddClient = (e) => {
                e.preventDefault();
                if (!newClientName || !newClientPhone) {
                    alert("Inserisci Nome e Numero di Telefono del cliente.");
                    return;
                }
                const cleanPhone = newClientPhone.replace(/\s+/g, '');
                const today = new Date().toISOString().split('T')[0];
                const newC = {
                    id: Date.now(),
                    name: newClientName,
                    phone: cleanPhone,
                    stamps: 0,
                    sub: null,
                    lastVisit: today
                };
                setClients([newC, ...clients]);
                setNewClientName('');
                setNewClientPhone('');
            };

            const updateStamps = (clientId, delta) => {
                const today = new Date().toISOString().split('T')[0];
                setClients(clients.map(c => {
                    if (c.id === clientId) {
                        let newStamps = Math.max(0, Math.min(5, c.stamps + delta));
                        return { ...c, stamps: newStamps, lastVisit: today };
                    }
                    return c;
                }));
            };

            const updateSubStamps = (clientId, delta) => {
                const today = new Date().toISOString().split('T')[0];
                setClients(clients.map(c => {
                    if (c.id === clientId && c.sub) {
                        let maxServices = c.sub.type === 'Bronze' ? 2 : c.sub.type === 'Silver' ? 4 : 10;
                        let newUsed = Math.max(0, Math.min(maxServices, c.sub.used + delta));
                        return { ...c, sub: { ...c.sub, used: newUsed }, lastVisit: today };
                    }
                    return c;
                }));
            };

            const assignSub = (clientId, type) => {
                const today = new Date().toISOString().split('T')[0];
                setClients(clients.map(c => {
                    if (c.id === clientId) {
                        return { ...c, sub: { type, used: 0, startDate: today }, lastVisit: today };
                    }
                    return c;
                }));
            };

            const changeSubTier = (clientId, newType) => {
                setClients(clients.map(c => {
                    if (c.id === clientId && c.sub) {
                        let maxServices = newType === 'Bronze' ? 2 : newType === 'Silver' ? 4 : 10;
                        let newUsed = Math.min(c.sub.used, maxServices);
                        return { ...c, sub: { ...c.sub, type: newType, used: newUsed } };
                    }
                    return c;
                }));
            };

            const removeSub = (clientId) => {
                setClients(clients.map(c => {
                    if (c.id === clientId) {
                        return { ...c, sub: null };
                    }
                    return c;
                }));
            };

            const deleteClient = (clientId) => {
                if (confirm("Sei sicuro di voler eliminare questo cliente?")) {
                    setClients(clients.filter(c => c.id !== clientId));
                }
            };

            const exportBackup = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(clients, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `barberia_romana_backup_${new Date().toISOString().split('T')[0]}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const importBackup = (e) => {
                const fileReader = new FileReader();
                if (e.target.files[0]) {
                    fileReader.readAsText(e.target.files[0], "UTF-8");
                    fileReader.onload = (event) => {
                        try {
                            const importedClients = JSON.parse(event.target.result);
                            if (Array.isArray(importedClients)) {
                                setClients(importedClients);
                                alert("Backup ripristinato con successo!");
                            } else {
                                alert("Il file non è valido.");
                            }
                        } catch (error) {
                            alert("Errore durante la lettura del file di backup.");
                        }
                    };
                }
            };

            // Genera il link univoco del cliente
            const getClientPersonalLink = (client) => {
                const payload = {
                    n: client.name,
                    s: client.stamps,
                    sub: client.sub ? {
                        t: client.sub.type,
                        u: client.sub.used,
                        m: client.sub.type === 'Bronze' ? 2 : client.sub.type === 'Silver' ? 4 : 10
                    } : null,
                    d: new Date().toLocaleDateString('it-IT')
                };
                const encodedData = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
                const baseUrl = window.location.origin + window.location.pathname;
                return `${baseUrl}?card=${encodedData}`;
            };

            const sendClientCardWhatsApp = (client) => {
                const personalLink = getClientPersonalLink(client);
                const cardTypeMsg = client.sub ? `Abbonamento ${client.sub.type} (${client.sub.used} usati)` : `Tessera Fedeltà (${client.stamps}/5 timbri)`;
                const message = encodeURIComponent(
                    `Ciao ${client.name}! Ecco la tua card digitale aggiornata di Barberia Romana 💈\n` +
                    `Stato: ${cardTypeMsg}\n\n` +
                    `Visualizza la tua tessera grafica qui:\n${personalLink}`
                );

                let waPhone = client.phone.replace(/[^0-9]/g, '');
                if (waPhone.length === 10 && waPhone.startsWith('3')) {
                    waPhone = '39' + waPhone;
                }

                window.open(`https://wa.me/${waPhone}?text=${message}`, '_blank');
            };

            const copyClientLink = (client) => {
                const personalLink = getClientPersonalLink(client);
                navigator.clipboard.writeText(personalLink).then(() => {
                    alert(`Link di ${client.name} copiato negli appunti! Puoi incollarlo dove preferisci.`);
                }).catch(() => {
                    prompt("Copia il link della card:", personalLink);
                });
            };

            // =====================================================================
            // VISTA 1: SCHERMATA GRAFICA PER IL CLIENTE
            // =====================================================================
            if (sharedCard) {
                const isSub = sharedCard.sub !== null;
                const subType = isSub ? sharedCard.sub.t : '';

                const subThemes = {
                    Bronze: {
                        cardBg: 'from-[#23150e] via-zinc-950 to-black',
                        border: 'border-amber-700/60',
                        label: 'text-amber-600',
                        badgeBg: 'bg-amber-900/30 border-amber-700/50 text-amber-500',
                        slotActive: 'border-amber-600 bg-gradient-to-br from-amber-600 to-amber-800 text-white shadow-[0_0_12px_rgba(217,119,6,0.45)]',
                        slotInactive: 'border-amber-900/40 bg-black/60 text-amber-800',
                        counterText: 'text-amber-500'
                    },
                    Silver: {
                        cardBg: 'from-[#1e2229] via-zinc-950 to-black',
                        border: 'border-slate-400/60',
                        label: 'text-slate-300',
                        badgeBg: 'bg-slate-800/60 border-slate-400/50 text-slate-200',
                        slotActive: 'border-slate-300 bg-gradient-to-br from-slate-200 to-slate-400 text-black shadow-[0_0_12px_rgba(203,213,225,0.45)]',
                        slotInactive: 'border-slate-700/50 bg-black/60 text-slate-600',
                        counterText: 'text-slate-200'
                    },
                    Gold: {
                        cardBg: 'from-[#261f0a] via-zinc-950 to-black',
                        border: 'border-yellow-500/60',
                        label: 'text-yellow-400',
                        badgeBg: 'bg-yellow-900/30 border-yellow-500/50 text-yellow-400',
                        slotActive: 'border-yellow-400 bg-gradient-to-br from-yellow-400 to-amber-500 text-black shadow-[0_0_14px_rgba(250,204,21,0.5)]',
                        slotInactive: 'border-yellow-900/40 bg-black/60 text-yellow-700',
                        counterText: 'text-yellow-400'
                    }
                };

                const theme = isSub ? (subThemes[subType] || subThemes.Gold) : null;

                return (
                    <div className="max-w-md mx-auto p-4 pb-8 flex flex-col min-h-screen justify-between">
                        <div>
                            <header className="text-center py-6 border-b border-zinc-800 mb-6">
                                <h1 className="text-2xl font-bold tracking-[0.2em] uppercase text-white logo-glow">Barberia Romana</h1>
                                <p className="text-xs text-zinc-400 mt-1">{isSub ? `Abbonamento ${subType}` : 'Tessera Fedeltà Digitale'}</p>
                            </header>

                            <div className={`bg-gradient-to-b ${isSub ? theme.cardBg : 'from-zinc-900 to-zinc-950'} border ${isSub ? theme.border : 'border-amber-500/40'} rounded-2xl p-6 shadow-2xl space-y-6 relative overflow-hidden`}>
                                <div className="flex justify-between items-start border-b border-zinc-800/80 pb-4">
                                    <div>
                                        <span className={`text-[10px] uppercase tracking-widest font-bold block mb-1 ${isSub ? theme.label : 'text-amber-500'}`}>Titolare Card</span>
                                        <h2 className="text-xl font-bold text-white">{sharedCard.n}</h2>
                                    </div>
                                    <div className="bg-emerald-500/10 border border-emerald-500/30 px-2.5 py-1 rounded-full flex items-center gap-1.5">
                                        <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                        <span className="text-[10px] font-semibold text-emerald-400 uppercase tracking-wider">Verificata</span>
                                    </div>
                                </div>

                                {isSub ? (
                                    <div className="text-center py-2 space-y-4">
                                        <div className={`inline-block border px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider ${theme.badgeBg}`}>
                                            Abbonamento {subType}
                                        </div>

                                        <p className="text-xs text-zinc-400">Servizi utilizzati: <strong className="text-white">{sharedCard.sub.u}</strong> su <strong className="text-white">{sharedCard.sub.m}</strong></p>

                                        <div className="grid grid-cols-5 gap-2 my-4">
                                            {Array.from({ length: sharedCard.sub.m }, (_, index) => {
                                                const slotNumber = index + 1;
                                                const isUsed = slotNumber <= sharedCard.sub.u;
                                                return (
                                                    <div 
                                                        key={index} 
                                                        className={`h-12 rounded-xl border-2 flex flex-col items-center justify-center font-bold text-xs transition-all ${
                                                            isUsed ? theme.slotActive : theme.slotInactive
                                                        }`}
                                                    >
                                                        {isUsed ? '✓' : slotNumber}
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        <div className="inline-block bg-black/70 border border-zinc-800 px-4 py-1.5 rounded-full">
                                            <span className="text-xs text-zinc-300">Servizi rimanenti: <strong className={theme.counterText}>{sharedCard.sub.m - sharedCard.sub.u}</strong></span>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="text-center py-2">
                                        <p className="text-xs text-zinc-400 mb-4">Colleziona 5 timbri: il 5° servizio è al <strong className="text-white">50% di sconto</strong></p>
                                        
                                        <div className="flex justify-center gap-2.5 my-4">
                                            {[1, 2, 3, 4, 5].map((stamp) => {
                                                const isCompleted = stamp <= sharedCard.s;
                                                const isFifth = stamp === 5;
                                                return (
                                                    <div 
                                                        key={stamp} 
                                                        className={`w-12 h-12 rounded-full border-2 flex flex-col items-center justify-center font-bold transition-all ${
                                                            isCompleted 
                                                                ? 'border-amber-500 bg-amber-500 text-black shadow-[0_0_15px_rgba(245,158,11,0.4)]' 
                                                                : isFifth 
                                                                    ? 'border-amber-500/40 text-amber-500/60 border-dashed' 
                                                                    : 'border-zinc-700 text-zinc-600'
                                                        }`}
                                                    >
                                                        {isCompleted ? (
                                                            <span className="text-lg">✓</span>
                                                        ) : isFifth ? (
                                                            <span className="text-[10px] leading-tight">-50%</span>
                                                        ) : (
                                                            <span className="text-sm">{stamp}</span>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        <div className="mt-4 inline-block bg-zinc-900 border border-zinc-800 px-4 py-1.5 rounded-full">
                                            <span className="text-xs text-zinc-300">Stato attuale: <strong className="text-amber-500">{sharedCard.s} su 5 timbri</strong></span>
                                        </div>
                                    </div>
                                )}

                                <div className="border-t border-zinc-800/80 pt-3 flex justify-between items-center text-[10px] text-zinc-500">
                                    <span>Aggiornato il: {sharedCard.d}</span>
                                    <span>Barberia Romana Official</span>
                                </div>
                            </div>

                            <div className="mt-6">
                                <a 
                                    href={`https://wa.me/${SHOP_WHATSAPP}?text=Ciao%20Barberia%20Romana,%20vorrei%20prenotare%20il%20mio%20prossimo%20appuntamento!`} 
                                    target="_blank" 
                                    rel="noreferrer"
                                    className="block w-full text-center bg-white hover:bg-zinc-200 text-black font-bold py-3.5 rounded-xl transition shadow-lg"
                                >
                                    Prenota Prossimo Appuntamento
                                </a>
                            </div>
                        </div>

                        <footer className="text-center pt-8 pb-4 text-[11px] text-zinc-600">
                            Barberia Romana • Card Digitale Personale
                        </footer>
                    </div>
                );
            }

            // =====================================================================
            // VISTA 2: HOME STAFF
            // =====================================================================
            return (
                <div className="max-w-md mx-auto p-4 pb-8 flex flex-col min-h-screen justify-between">
                    <div className="flex-1 flex flex-col">
                        <header className="text-center py-8 border-b border-zinc-800 mb-6 bg-gradient-to-b from-zinc-900/60 to-black rounded-2xl">
                            <h1 className="text-3xl font-extrabold tracking-[0.22em] uppercase text-white logo-glow">Barberia Romana</h1>
                            <p className="text-[11px] text-zinc-400 tracking-[0.25em] mt-2 uppercase">Staff Management</p>
                        </header>

                        {!isAuthorized ? (
                            <div className="my-auto py-8">
                                <div className="bg-zinc-900/90 border border-zinc-700/80 p-8 rounded-3xl text-center space-y-6 shadow-2xl">
                                    <div className="space-y-1">
                                        <div className="w-12 h-12 bg-zinc-800 border border-zinc-700 rounded-2xl mx-auto flex items-center justify-center text-white text-lg font-bold mb-3">
                                            PIN
                                        </div>
                                        <h2 className="text-lg font-bold tracking-wide uppercase text-white">Area Riservata</h2>
                                        <p className="text-xs text-zinc-400">Inserisci il codice di sicurezza per accedere</p>
                                    </div>
                                    <form onSubmit={handleLogin} className="space-y-4">
                                        <input 
                                            type="password" 
                                            inputMode="numeric"
                                            placeholder="••••" 
                                            value={pinInput}
                                            onChange={(e) => setPinInput(e.target.value)}
                                            className="w-full bg-black border border-zinc-700 rounded-xl p-4 text-center text-3xl tracking-[0.6em] text-white focus:outline-none focus:border-white transition"
                                            maxLength="4"
                                            autoFocus
                                        />
                                        <button type="submit" className="w-full bg-white hover:bg-zinc-200 text-black font-bold py-3.5 rounded-xl transition tracking-wide shadow-lg">
                                            Sblocca Pannello
                                        </button>
                                    </form>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center bg-zinc-900 p-4 rounded-xl border border-zinc-800">
                                    <div className="flex items-center gap-2">
                                        <span className="w-2.5 h-2.5 rounded-full bg-white animate-pulse"></span>
                                        <span className="text-sm font-semibold text-white">Staff Connesso</span>
                                    </div>
                                    <button onClick={() => setIsAuthorized(false)} className="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded-lg transition font-medium border border-zinc-700">
                                        Blocca
                                    </button>
                                </div>

                                <div className="bg-zinc-900 border border-zinc-800 p-3 rounded-xl flex items-center justify-between gap-2">
                                    <span className="text-xs text-zinc-400 font-medium pl-1">Backup Dati:</span>
                                    <div className="flex gap-2">
                                        <button 
                                            onClick={exportBackup} 
                                            className="text-xs bg-zinc-800 hover:bg-zinc-700 text-white border border-zinc-700 px-3 py-1.5 rounded-lg transition font-semibold"
                                        >
                                            Esporta
                                        </button>
                                        <label className="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700 px-3 py-1.5 rounded-lg transition font-semibold cursor-pointer">
                                            Importa
                                            <input type="file" accept=".json" onChange={importBackup} className="hidden" />
                                        </label>
                                    </div>
                                </div>

                                <div className="bg-zinc-900 border border-zinc-800 p-4 rounded-xl space-y-3">
                                    <h3 className="font-semibold text-sm text-white uppercase tracking-wider">Registra Nuovo Cliente</h3>
                                    <form onSubmit={handleAddClient} className="space-y-2">
                                        <input 
                                            type="text" 
                                            placeholder="Nome e Cognome" 
                                            value={newClientName}
                                            onChange={(e) => setNewClientName(e.target.value)}
                                            className="w-full bg-black border border-zinc-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-white"
                                        />
                                        <input 
                                            type="tel" 
                                            placeholder="Numero di Telefono (es. 3331234567)" 
                                            value={newClientPhone}
                                            onChange={(e) => setNewClientPhone(e.target.value)}
                                            className="w-full bg-black border border-zinc-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-white"
                                        />
                                        <button type="submit" className="w-full bg-white text-black font-bold py-2.5 rounded-lg hover:bg-zinc-200 text-sm transition">
                                            + Aggiungi Cliente
                                        </button>
                                    </form>
                                </div>

                                <div>
                                    <input 
                                        type="text" 
                                        placeholder="Cerca cliente per nome o telefono..." 
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-white"
                                    />
                                </div>

                                <div className="space-y-4">
                                    {clients
                                        .filter(c => c.name.toLowerCase().includes(searchQuery.toLowerCase()) || c.phone.includes(searchQuery))
                                        .map(client => (
                                            <div key={client.id} className="bg-zinc-900 border border-zinc-800 p-4 rounded-xl space-y-4">
                                                <div className="flex justify-between items-start gap-2">
                                                    <div>
                                                        <h3 className="font-bold text-base text-white">{client.name}</h3>
                                                        <p className="text-xs text-zinc-400">Tel: {client.phone}</p>
                                                        <p className="text-[10px] text-zinc-500 mt-0.5">Ultima visita: {client.lastVisit || 'N/D'}</p>
                                                    </div>
                                                    <div className="flex gap-1.5 flex-wrap justify-end">
                                                        <button 
                                                            onClick={() => sendClientCardWhatsApp(client)}
                                                            className="text-xs bg-white hover:bg-zinc-200 text-black px-2.5 py-1.5 rounded font-bold transition"
                                                        >
                                                            Invia WA
                                                        </button>
                                                        <button 
                                                            onClick={() => copyClientLink(client)}
                                                            className="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700 px-2.5 py-1.5 rounded font-semibold transition"
                                                            title="Copia link card"
                                                        >
                                                            Copia Link
                                                        </button>
                                                        <button 
                                                            onClick={() => deleteClient(client.id)}
                                                            className="text-xs bg-zinc-800 text-zinc-400 border border-zinc-700 px-2 py-1.5 rounded hover:text-white transition"
                                                        >
                                                            Elimina
                                                        </button>
                                                    </div>
                                                </div>

                                                {client.sub ? (
                                                    <div className="border-t border-zinc-800 pt-3 space-y-3">
                                                        <div className="flex justify-between items-center text-xs">
                                                            <span className={`font-bold ${
                                                                client.sub.type === 'Bronze' ? 'text-amber-500' : 
                                                                client.sub.type === 'Silver' ? 'text-slate-300' : 'text-yellow-400'
                                                            }`}>
                                                                Abbonamento {client.sub.type}
                                                            </span>
                                                            <span className="text-zinc-400">Usati: <strong className="text-white">{client.sub.used}</strong> / {client.sub.type === 'Bronze' ? 2 : client.sub.type === 'Silver' ? 4 : 10}</span>
                                                        </div>
                                                        <div className="flex gap-2">
                                                            <button onClick={() => updateSubStamps(client.id, -1)} className="bg-zinc-800 hover:bg-zinc-700 text-white px-3 py-1.5 rounded text-sm font-bold border border-zinc-700">-</button>
                                                            <button onClick={() => updateSubStamps(client.id, 1)} className="flex-1 bg-zinc-200 hover:bg-white text-black py-1.5 rounded text-sm font-bold">+ Servizio</button>
                                                        </div>
                                                        <div className="pt-2 border-t border-zinc-800/80 flex items-center justify-between">
                                                            <span className="text-[11px] text-zinc-400">Cambia tipo:</span>
                                                            <div className="flex gap-1">
                                                                {['Bronze', 'Silver', 'Gold'].map(tier => (
                                                                    <button 
                                                                        key={tier}
                                                                        onClick={() => changeSubTier(client.id, tier)}
                                                                        className={`text-[10px] px-2 py-1 rounded font-bold border transition ${
                                                                            client.sub.type === tier ? 'bg-white text-black border-white' : 'bg-zinc-800 text-zinc-400 border-zinc-700'
                                                                        }`}
                                                                    >
                                                                        {tier}
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        </div>
                                                        <button onClick={() => removeSub(client.id)} className="w-full bg-zinc-950 text-zinc-400 border border-zinc-800 hover:text-white py-1.5 rounded text-xs transition">
                                                            Termina e Rimuovi Abbonamento
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <div className="border-t border-zinc-800 pt-3 space-y-3">
                                                        <div className="flex justify-between items-center text-xs mb-1">
                                                            <span className="text-zinc-400">Tessera Fedeltà (Timbri: <strong className="text-white">{client.stamps}/5</strong>)</span>
                                                        </div>
                                                        <div className="flex gap-2">
                                                            <button onClick={() => updateStamps(client.id, -1)} className="bg-zinc-800 hover:bg-zinc-700 text-white px-3 py-1.5 rounded text-sm font-bold border border-zinc-700">-</button>
                                                            <button onClick={() => updateStamps(client.id, 1)} className="flex-1 bg-white text-black hover:bg-zinc-200 py-1.5 rounded text-sm font-bold">+ Aggiungi Timbro</button>
                                                        </div>
                                                        <div className="pt-2 border-t border-zinc-800">
                                                            <p className="text-[11px] text-zinc-400 mb-1.5">Oppure converti in abbonamento:</p>
                                                            <div className="grid grid-cols-3 gap-2">
                                                                <button onClick={() => assignSub(client.id, 'Bronze')} className="bg-zinc-800 hover:bg-zinc-700 border border-amber-700/40 text-xs py-1.5 rounded font-semibold text-amber-500">Bronze</button>
                                                                <button onClick={() => assignSub(client.id, 'Silver')} className="bg-zinc-800 hover:bg-zinc-700 border border-slate-500/40 text-xs py-1.5 rounded font-semibold text-slate-300">Silver</button>
                                                                <button onClick={() => assignSub(client.id, 'Gold')} className="bg-zinc-800 hover:bg-zinc-700 border border-yellow-500/40 text-xs py-1.5 rounded font-semibold text-yellow-400">Gold</button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        ))
                                    }
                                </div>
                            </div>
                        )}
                    </div>

                    <footer className="text-center pt-8 pb-4 text-[11px] text-zinc-600">
                        Barberia Romana • Uso Riservato
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
