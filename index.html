<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barberia Romana - Gestione Fedeltà</title>
    <!-- Tailwind CSS per un design minimale e ad alto contrasto -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React e Babel per gestire l'interattività dello smartphone -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-black text-white min-h-screen font-sans flex flex-col justify-between">
    <div id="root" class="w-full"></div>

    <script type="text/babel">
        function App() {
            const [pinInput, setPinInput] = React.useState('');
            const [isAuthorized, setIsAuthorized] = React.useState(false);
            const [searchQuery, setSearchQuery] = React.useState('');

            // Campi per aggiungere un nuovo cliente da parte dello staff
            const [newClientName, setNewClientName] = React.useState('');
            const [newClientPhone, setNewClientPhone] = React.useState('');

            // Database locale persistente dei clienti gestito dallo staff
            const [clients, setClients] = React.useState(() => {
                const saved = localStorage.getItem('barberia_romana_staff_clients');
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) { }
                }
                return [
                    { id: 1, name: "Marco Rossi", phone: "3331234567", stamps: 3, sub: null, lastVisit: "2026-11-01" },
                    { id: 2, name: "Luca Bianchi", phone: "3389876543", stamps: 5, sub: null, lastVisit: "2026-10-25" },
                ];
            });

            // Salva i dati in automatico sul telefono
            React.useEffect(() => {
                localStorage.setItem('barberia_romana_staff_clients', JSON.stringify(clients));
            }, [clients]);

            const STAFF_PIN = "1893";
            const SHOP_WHATSAPP = "3318610302";

            const handleLogin = (e) => {
                e.preventDefault();
                if (pinInput === STAFF_PIN) {
                    setIsAuthorized(true);
                    setPinInput('');
                } else {
                    alert("PIN errato!");
                    setPinInput('');
                }
            };

            const handleAddClient = (e) => {
                e.preventDefault();
                if (!newClientName || !newClientPhone) {
                    alert("Inserisci Nome e Numero di Telefono del cliente.");
                    return;
                }
                const newC = {
                    id: Date.now(),
                    name: newClientName,
                    phone: newClientPhone,
                    stamps: 0,
                    sub: null,
                    lastVisit: new Date().toISOString().split('T')[0]
                };
                setClients([newC, ...clients]);
                setNewClientName('');
                setNewClientPhone('');
            };

            const updateStamps = (clientId, delta) => {
                setClients(clients.map(c => {
                    if (c.id === clientId) {
                        let newStamps = Math.max(0, Math.min(5, c.stamps + delta));
                        return { ...c, stamps: newStamps, lastVisit: new Date().toISOString().split('T')[0] };
                    }
                    return c;
                }));
            };

            const updateSubStamps = (clientId, delta) => {
                setClients(clients.map(c => {
                    if (c.id === clientId && c.sub) {
                        let maxServices = c.sub.type === 'Bronze' ? 2 : c.sub.type === 'Silver' ? 4 : 10;
                        let newUsed = Math.max(0, Math.min(maxServices, c.sub.used + delta));
                        return { ...c, sub: { ...c.sub, used: newUsed }, lastVisit: new Date().toISOString().split('T')[0] };
                    }
                    return c;
                }));
            };

            const assignSub = (clientId, type, serviceName) => {
                setClients(clients.map(c => {
                    if (c.id === clientId) {
                        return { ...c, sub: { type, serviceName, used: 0, startDate: new Date().toISOString().split('T')[0] }, lastVisit: new Date().toISOString().split('T')[0] };
                    }
                    return c;
                }));
            };

            const removeSub = (clientId) => {
                setClients(clients.map(c => {
                    if (c.id === clientId) {
                        return { ...c, sub: null };
                    }
                    return c;
                }));
            };

            const deleteClient = (clientId) => {
                if (confirm("Sei sicuro di voler eliminare questo cliente?")) {
                    setClients(clients.filter(c => c.id !== clientId));
                }
            };

            // Invia la tessera aggiornata via WhatsApp al cliente
            const sendClientCardWhatsApp = (client) => {
                const subText = client.sub ? `\nAbbonamento attivo: ${client.sub.type} (${client.sub.serviceName}) - Usati: ${client.sub.used}` : '';
                const message = encodeURIComponent(`Ciao ${client.name}! Ecco la tua situazione aggiornata presso Barberia Romana 💈\nTimbri Tessera Fedeltà: ${client.stamps} / 5 (Il 5° è al 50% di sconto!)${subText}\n\nTi aspettiamo in negozio!`);
                window.open(`https://wa.me/${client.phone}?text=${message}`, '_blank');
            };

            return (
                <div className="max-w-md mx-auto p-4 pb-8 flex flex-col min-h-screen justify-between">
                    <div>
                        {/* Header */}
                        <header className="text-center py-6 border-b border-zinc-800 mb-6">
                            <h1 className="text-2xl font-bold tracking-widest uppercase">Barberia Romana</h1>
                            <p className="text-xs text-zinc-400 mt-1">Gestione Fedeltà & Abbonamenti</p>
                        </header>

                        {!isAuthorized ? (
                            /* SCHERMATA LOGIN PIN STAFF */
                            <div className="space-y-6">
                                <div className="bg-zinc-900 border border-zinc-800 p-6 rounded-xl text-center space-y-4">
                                    <h2 className="text-lg font-semibold">Area Riservata Staff</h2>
                                    <p className="text-xs text-zinc-400">Inserisci il PIN per accedere al pannello di gestione clienti e tessere.</p>
                                    <form onSubmit={handleLogin} className="space-y-4">
                                        <input 
                                            type="password" 
                                            placeholder="Inserisci PIN (••••)" 
                                            value={pinInput}
                                            onChange={(e) => setPinInput(e.target.value)}
                                            className="w-full bg-black border border-zinc-700 rounded-lg p-3 text-center text-lg tracking-widest text-white focus:outline-none focus:border-white"
                                            maxLength="4"
                                        />
                                        <button type="submit" className="w-full bg-white text-black font-semibold py-3 rounded-lg hover:bg-zinc-200 transition">
                                            Accedi
                                        </button>
                                    </form>
                                </div>

                                {/* Info Servizi per i clienti che aprono la pagina */}
                                <div className="space-y-3 pt-4">
                                    <h3 className="text-sm font-semibold text-zinc-400 uppercase tracking-wider">I Nostri Servizi</h3>
                                    <div className="bg-zinc-900 border border-zinc-800 p-4 rounded-xl">
                                        <div className="flex justify-between items-center mb-1">
                                            <span className="font-bold text-amber-500">Tessera Fedeltà</span>
                                            <span className="text-xs bg-zinc-800 px-2 py-1 rounded text-zinc-300">5 Timbri</span>
                                        </div>
                                        <p className="text-xs text-zinc-400">Ogni 5 timbri, il 5° servizio è scontato del 50%!</p>
                                    </div>
                                    <div className="bg-zinc-900 border border-zinc-800 p-4 rounded-xl">
                                        <div className="flex justify-between items-center mb-1">
                                            <span className="font-bold text-amber-600">Bronze, Silver & Gold</span>
                                            <span className="text-xs bg-zinc-800 px-2 py-1 rounded text-zinc-300">Abbonamenti</span>
                                        </div>
                                        <p className="text-xs text-zinc-400">Pacchetti dedicati da 2, 4 o 10 servizi.</p>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            /* PANNELLO DI GESTIONE STAFF */
                            <div className="space-y-6">
                                <div className="flex justify-between items-center bg-zinc-900 p-4 rounded-xl border border-zinc-800">
                                    <span className="text-sm font-medium text-emerald-400">● Staff Autorizzato</span>
                                    <button onClick={() => setIsAuthorized(false)} className="text-xs text-zinc-400 hover:text-white underline">
                                        Blocca / Esci
                                    </button>
                                </div>

                                {/* Form Aggiungi Nuovo Cliente */}
                                <div className="bg-zinc-900 border border-zinc-800 p-4 rounded-xl space-y-3">
                                    <h3 className="font-semibold text-sm">Registra Nuovo Cliente</h3>
                                    <form onSubmit={handleAddClient} className="space-y-2">
                                        <input 
                                            type="text" 
                                            placeholder="Nome e Cognome" 
                                            value={newClientName}
                                            onChange={(e) => setNewClientName(e.target.value)}
                                            className="w-full bg-black border border-zinc-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-white"
                                        />
                                        <input 
                                            type="tel" 
                                            placeholder="Numero di Telefono (es. 3331234567)" 
                                            value={newClientPhone}
                                            onChange={(e) => setNewClientPhone(e.target.value)}
                                            className="w-full bg-black border border-zinc-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-white"
                                        />
                                        <button type="submit" className="w-full bg-white text-black font-semibold py-2.5 rounded-lg hover:bg-zinc-200 text-sm transition">
                                            + Aggiungi Cliente in Lista
                                        </button>
                                    </form>
                                </div>

                                {/* Ricerca Cliente */}
                                <div>
                                    <input 
                                        type="text" 
                                        placeholder="Cerca cliente per nome o telefono..." 
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-white"
                                    />
                                </div>

                                {/* Lista Clienti */}
                                <div className="space-y-4">
                                    {clients
                                        .filter(c => c.name.toLowerCase().includes(searchQuery.toLowerCase()) || c.phone.includes(searchQuery))
                                        .map(client => (
                                            <div key={client.id} className="bg-zinc-900 border border-zinc-800 p-4 rounded-xl space-y-4">
                                                <div className="flex justify-between items-start">
                                                    <div>
                                                        <h3 className="font-bold text-base">{client.name}</h3>
                                                        <p className="text-xs text-zinc-400">Tel: {client.phone}</p>
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <button 
                                                            onClick={() => sendClientCardWhatsApp(client)}
                                                            className="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1.5 rounded font-medium transition"
                                                            title="Invia tessera via WhatsApp"
                                                        >
                                                            Invia Tessera WA
                                                        </button>
                                                        <button 
                                                            onClick={() => deleteClient(client.id)}
                                                            className="text-xs bg-red-900/20 text-red-400 border border-red-800/40 px-2 py-1.5 rounded hover:bg-red-900/40 transition"
                                                        >
                                                            Elimina
                                                        </button>
                                                    </div>
                                                </div>

                                                {/* Gestione Tessere Fedeltà Standard */}
                                                <div className="border-t border-zinc-800 pt-3">
                                                    <div className="flex justify-between items-center text-xs mb-2">
                                                        <span className="text-zinc-400">Tessera Fedeltà (Timbri: {client.stamps}/5)</span>
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <button onClick={() => updateStamps(client.id, -1)} className="bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 rounded text-sm font-bold">-</button>
                                                        <button onClick={() => updateStamps(client.id, 1)} className="flex-1 bg-white text-black hover:bg-zinc-200 py-1.5 rounded text-sm font-semibold">+ Aggiungi Timbro</button>
                                                    </div>
                                                </div>

                                                {/* Gestione Abbonamenti */}
                                                <div className="border-t border-zinc-800 pt-3">
                                                    {client.sub ? (
                                                        <div className="space-y-2">
                                                            <div className="flex justify-between items-center text-xs">
                                                                <span className="font-bold text-amber-500">{client.sub.type} ({client.sub.serviceName})</span>
                                                                <span className="text-zinc-400">Usati: {client.sub.used} / {client.sub.type === 'Bronze' ? 2 : client.sub.type === 'Silver' ? 4 : 10}</span>
                                                            </div>
                                                            <div className="flex gap-2">
                                                                <button onClick={() => updateSubStamps(client.id, -1)} className="bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 rounded text-sm font-bold">-</button>
                                                                <button onClick={() => updateSubStamps(client.id, 1)} className="flex-1 bg-amber-600 hover:bg-amber-500 text-white py-1.5 rounded text-sm font-semibold">+ Servizio Abbonamento</button>
                                                            </div>
                                                            <button onClick={() => removeSub(client.id)} className="w-full bg-red-900/30 text-red-400 border border-red-800/50 hover:bg-red-900/50 py-1.5 rounded text-xs transition mt-2">
                                                                Termina e Rimuovi Abbonamento
                                                            </button>
                                                        </div>
                                                    ) : (
                                                        <div className="space-y-2">
                                                            <p className="text-xs text-zinc-400">Nessun abbonamento attivo. Assegna:</p>
                                                            <div className="grid grid-cols-3 gap-2">
                                                                <button onClick={() => assignSub(client.id, 'Bronze', 'Taglio')} className="bg-zinc-800 hover:bg-zinc-700 text-xs py-1.5 rounded font-medium">Bronze</button>
                                                                <button onClick={() => assignSub(client.id, 'Silver', 'Barba')} className="bg-zinc-800 hover:bg-zinc-700 text-xs py-1.5 rounded font-medium">Silver</button>
                                                                <button onClick={() => assignSub(client.id, 'Gold', 'Completo')} className="bg-zinc-800 hover:bg-zinc-700 text-xs py-1.5 rounded font-medium">Gold</button>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        ))
                                    }
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Footer con accesso Staff nascosto in basso */}
                    <footer className="text-center pt-8 pb-4 border-t border-zinc-900 mt-8">
                        {!isAuthorized && (
                            <button 
                                onClick={() => setIsAuthorized(false)} 
                                className="text-[11px] text-zinc-600 hover:text-zinc-400 tracking-wider uppercase transition"
                            >
                                Area Riservata (Staff)
                            </button>
                        )}
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
