<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barberia Romana - Tessera Digitale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 15px rgba(245, 158, 11, 0.3), 0 0 30px rgba(245, 158, 11, 0.1); }
            50% { text-shadow: 0 0 25px rgba(245, 158, 11, 0.6), 0 0 50px rgba(245, 158, 11, 0.3); }
        }
        .neon-title {
            animation: glow 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen font-sans flex flex-col justify-between">
    <div id="root" class="w-full"></div>

    <script type="text/babel">
        function App() {
            // Controlla se l'URL contiene i dati di una tessera cliente (?card=...)
            const [sharedCard, setSharedCard] = React.useState(() => {
                const params = new URLSearchParams(window.location.search);
                const cardData = params.get('card');
                if (cardData) {
                    try {
                        const decoded = decodeURIComponent(escape(atob(cardData)));
                        return JSON.parse(decoded);
                    } catch (e) {
                        return null;
                    }
                }
                return null;
            });

            const [pinInput, setPinInput] = React.useState('');
            const [isAuthorized, setIsAuthorized] = React.useState(false);
            const [searchQuery, setSearchQuery] = React.useState('');

            // Campi per aggiungere un nuovo cliente
            const [newClientName, setNewClientName] = React.useState('');
            const [newClientPhone, setNewClientPhone] = React.useState('');

            // Database locale persistente
            const [clients, setClients] = React.useState(() => {
                const saved = localStorage.getItem('barberia_romana_staff_clients');
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) { }
                }
                return [
                    { id: 1, name: "Marco Rossi", phone: "3331234567", stamps: 3, sub: null, lastVisit: "2026-11-01" },
                    { id: 2, name: "Luca Bianchi", phone: "3389876543", stamps: 5, sub: null, lastVisit: "2026-10-25" },
                ];
            });

            React.useEffect(() => {
                localStorage.setItem('barberia_romana_staff_clients', JSON.stringify(clients));
            }, [clients]);

            const STAFF_PIN = "1893";
            const SHOP_WHATSAPP = "3318610302";

            const handleLogin = (e) => {
                e.preventDefault();
                if (pinInput === STAFF_PIN) {
                    setIsAuthorized(true);
                    setPinInput('');
                } else {
                    alert("PIN errato!");
                    setPinInput('');
                }
            };

            const handleAddClient = (e) => {
                e.preventDefault();
                if (!newClientName || !newClientPhone) {
                    alert("Inserisci Nome e Numero di Telefono del cliente.");
                    return;
                }
                const cleanPhone = newClientPhone.replace(/\s+/g, '');
                const newC = {
                    id: Date.now(),
                    name: newClientName,
                    phone: cleanPhone,
                    stamps: 0,
                    sub: null,
                    lastVisit: new Date().toISOString().split('T')[0]
                };
                setClients([newC, ...clients]);
                setNewClientName('');
                setNewClientPhone('');
            };

            const updateStamps = (clientId, delta) => {
                setClients(clients.map(c => {
                    if (c.id === clientId) {
                        let newStamps = Math.max(0, Math.min(5, c.stamps + delta));
                        return { ...c, stamps: newStamps, lastVisit: new Date().toISOString().split('T')[0] };
                    }
                    return c;
                }));
            };

            const updateSubStamps = (clientId, delta) => {
                setClients(clients.map(c => {
                    if (c.id === clientId && c.sub) {
                        let maxServices = c.sub.type === 'Bronze' ? 2 : c.sub.type === 'Silver' ? 4 : 10;
                        let newUsed = Math.max(0, Math.min(maxServices, c.sub.used + delta));
                        return { ...c, sub: { ...c.sub, used: newUsed }, lastVisit: new Date().toISOString().split('T')[0] };
                    }
                    return c;
                }));
            };

            const assignSub = (clientId, type, serviceName) => {
                setClients(clients.map(c => {
                    if (c.id === clientId) {
                        return { ...c, sub: { type, serviceName, used: 0, startDate: new Date().toISOString().split('T')[0] }, lastVisit: new Date().toISOString().split('T')[0] };
                    }
                    return c;
                }));
            };

            const removeSub = (clientId) => {
                setClients(clients.map(c => {
                    if (c.id === clientId) {
                        return { ...c, sub: null };
                    }
                    return c;
                }));
            };

            const deleteClient = (clientId) => {
                if (confirm("Sei sicuro di voler eliminare questo cliente?")) {
                    setClients(clients.filter(c => c.id !== clientId));
                }
            };

            // Funzioni di Backup e Ripristino Dati
            const exportBackup = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(clients, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `barberia_romana_backup_${new Date().toISOString().split('T')[0]}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const importBackup = (e) => {
                const fileReader = new FileReader();
                if (e.target.files[0]) {
                    fileReader.readAsText(e.target.files[0], "UTF-8");
                    fileReader.onload = (event) => {
                        try {
                            const importedClients = JSON.parse(event.target.result);
                            if (Array.isArray(importedClients)) {
                                setClients(importedClients);
                                alert("Backup ripristinato con successo!");
                            } else {
                                alert("Il file non è valido.");
                            }
                        } catch (error) {
                            alert("Errore durante la lettura del file di backup.");
                        }
                    };
                }
            };

            // Genera il link univoco con i dati del cliente e apre WhatsApp
            const sendClientCardWhatsApp = (client) => {
                const payload = {
                    n: client.name,
                    s: client.stamps,
                    sub: client.sub ? {
                        t: client.sub.type,
                        srv: client.sub.serviceName,
                        u: client.sub.used,
                        m: client.sub.type === 'Bronze' ? 2 : client.sub.type === 'Silver' ? 4 : 10
                    } : null,
                    d: new Date().toLocaleDateString('it-IT')
                };

                const encodedData = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
                const baseUrl = window.location.origin + window.location.pathname;
                const personalLink = `${baseUrl}?card=${encodedData}`;

                const subText = client.sub ? `\nAbbonamento ${client.sub.type}: ${client.sub.used}/${payload.sub.m} servizi usati` : '';
                const message = encodeURIComponent(
                    `Ciao ${client.name}! Ecco la tua tessera digitale aggiornata di Barberia Romana 💈\n` +
                    `Timbri attuali: ${client.stamps} / 5${subText}\n\n` +
                    `Visualizza la tua tessera grafica qui:\n${personalLink}`
                );

                let waPhone = client.phone.replace(/[^0-9]/g, '');
                if (waPhone.length === 10 && waPhone.startsWith('3')) {
                    waPhone = '39' + waPhone;
                }

                window.open(`https://wa.me/${waPhone}?text=${message}`, '_blank');
            };

            // =====================================================================
            // VISTA 1: SCHERMATA GRAFICA PER IL CLIENTE (QUANDO APRE IL LINK DA WA)
            // =====================================================================
            if (sharedCard) {
                return (
                    <div className="max-w-md mx-auto p-4 pb-8 flex flex-col min-h-screen justify-between">
                        <div>
                            <header className="text-center py-6 border-b border-zinc-800 mb-6">
                                <h1 className="text-2xl font-bold tracking-widest uppercase text-amber-500 neon-title">Barberia Romana</h1>
                                <p className="text-xs text-zinc-400 mt-1">Tessera Digitale Ufficiale</p>
                            </header>

                            <div className="bg-gradient-to-b from-zinc-900 to-zinc-950 border border-amber-500/40 rounded-2xl p-6 shadow-2xl space-y-6 relative overflow-hidden">
                                <div className="flex justify-between items-start border-b border-zinc-800 pb-4">
                                    <div>
                                        <span className="text-[10px] uppercase tracking-widest text-amber-500 font-bold block mb-1">Titolare Tessera</span>
                                        <h2 className="text-xl font-bold text-white">{sharedCard.n}</h2>
                                    </div>
                                    <div className="bg-emerald-500/10 border border-emerald-500/30 px-2.5 py-1 rounded-full flex items-center gap-1.5">
                                        <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                        <span className="text-[10px] font-semibold text-emerald-400 uppercase tracking-wider">Verificata</span>
                                    </div>
                                </div>

                                <div className="text-center py-2">
                                    <p className="text-xs text-zinc-400 mb-4">Colleziona 5 timbri: il 5° servizio è al <strong className="text-white">50% di sconto</strong></p>
                                    
                                    <div className="flex justify-center gap-2.5 my-4">
                                        {[1, 2, 3, 4, 5].map((stamp) => {
                                            const isCompleted = stamp <= sharedCard.s;
                                            const isFifth = stamp === 5;
                                            return (
                                                <div 
                                                    key={stamp} 
                                                    className={`w-12 h-12 rounded-full border-2 flex flex-col items-center justify-center font-bold transition-all ${
                                                        isCompleted 
                                                            ? 'border-amber-500 bg-amber-500 text-black shadow-[0_0_15px_rgba(245,158,11,0.4)]' 
                                                            : isFifth 
                                                                ? 'border-amber-500/40 text-amber-500/60 border-dashed' 
                                                                : 'border-zinc-700 text-zinc-600'
                                                    }`}
                                                >
                                                    {isCompleted ? (
                                                        <span className="text-lg">✓</span>
                                                    ) : isFifth ? (
                                                        <span className="text-[10px] leading-tight">-50%</span>
                                                    ) : (
                                                        <span className="text-sm">{stamp}</span>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <div className="mt-4 inline-block bg-zinc-900 border border-zinc-800 px-4 py-1.5 rounded-full">
                                        <span className="text-xs text-zinc-300">Stato attuale: <strong className="text-amber-500">{sharedCard.s} su 5 timbri</strong></span>
                                    </div>
                                </div>

                                {sharedCard.sub && (
                                    <div className="border-t border-zinc-800 pt-5 space-y-3">
                                        <div className="flex justify-between items-center">
                                            <span className="text-xs uppercase tracking-wider text-zinc-400 font-semibold">Abbonamento Attivo</span>
                                            <span className="text-xs font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2.5 py-0.5 rounded">
                                                {sharedCard.sub.t} Card ({sharedCard.sub.srv})
                                            </span>
                                        </div>
                                        
                                        <div className="w-full bg-zinc-800 h-2.5 rounded-full overflow-hidden">
                                            <div 
                                                className="bg-amber-500 h-full rounded-full" 
                                                style={{ width: `${(sharedCard.sub.u / sharedCard.sub.m) * 100}%` }}
                                            ></div>
                                        </div>
                                        
                                        <div className="flex justify-between text-xs text-zinc-400">
                                            <span>Utilizzati: <strong className="text-white">{sharedCard.sub.u}</strong></span>
                                            <span>Rimanenti: <strong className="text-emerald-400">{sharedCard.sub.m - sharedCard.sub.u}</strong> su {sharedCard.sub.m}</span>
                                        </div>
                                    </div>
                                )}

                                <div className="border-t border-zinc-800/80 pt-3 flex justify-between items-center text-[10px] text-zinc-500">
                                    <span>Aggiornato il: {sharedCard.d}</span>
                                    <span>Barberia Romana Official</span>
                                </div>
                            </div>

                            <div className="mt-6">
                                <a 
                                    href={`https://wa.me/${SHOP_WHATSAPP}?text=Ciao%20Barberia%20Romana,%20vorrei%20prenotare%20il%20mio%20prossimo%20appuntamento!`} 
                                    target="_blank" 
                                    rel="noreferrer"
                                    className="block w-full text-center bg-white hover:bg-zinc-200 text-black font-bold py-3.5 rounded-xl transition shadow-lg"
                                >
                                    Prenota Prossimo Appuntamento
                                </a>
                            </div>
                        </div>

                        <footer className="text-center pt-8 pb-4 text-[11px] text-zinc-600">
                            Barberia Romana • Tessera Digitale Personale
                        </footer>
                    </div>
                );
            }

            // =====================================================================
            // VISTA 2: HOME STAFF SPETTACOLARE & GESTIONALE
            // =====================================================================
            return (
                <div className="max-w-md mx-auto p-4 pb-8 flex flex-col min-h-screen justify-between">
                    <div className="flex-1 flex flex-col">
                        <header className="text-center py-8 border-b border-zinc-800/80 mb-6 bg-gradient-to-b from-zinc-950 to-black rounded-2xl shadow-inner">
                            <h1 className="text-3xl font-extrabold tracking-widest uppercase text-amber-500 neon-title">Barberia Romana</h1>
                            <p className="text-xs text-zinc-400 tracking-widest mt-2 uppercase">Official Staff Management</p>
                        </header>

                        {!isAuthorized ? (
                            <div className="my-auto py-8">
                                <div className="bg-zinc-900/90 border border-amber-500/30 p-8 rounded-3xl text-center space-y-6 shadow-2xl backdrop-blur-sm">
                                    <div className="space-y-1">
                                        <div className="w-12 h-12 bg-amber-500/10 border border-amber-500/30 rounded-2xl mx-auto flex items-center justify-center text-amber-500 text-xl font-bold mb-3 shadow-[0_0_15px_rgba(245,158,11,0.2)]">
                                            🔒
                                        </div>
                                        <h2 className="text-lg font-bold tracking-wide uppercase text-white">Area Riservata</h2>
                                        <p className="text-xs text-zinc-400">Inserisci il PIN di sicurezza per sbloccare il sistema</p>
                                    </div>
                                    <form onSubmit={handleLogin} className="space-y-4">
                                        <input 
                                            type="password" 
                                            inputMode="numeric"
                                            placeholder="••••" 
                                            value={pinInput}
                                            onChange={(e) => setPinInput(e.target.value)}
                                            className="w-full bg-black border border-zinc-700 rounded-xl p-4 text-center text-3xl tracking-[0.6em] text-amber-400 focus:outline-none focus:border-amber-500 transition shadow-inner"
                                            maxLength="4"
                                            autoFocus
                                        />
                                        <button type="submit" className="w-full bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-black font-bold py-3.5 rounded-xl transition tracking-wide shadow-lg">
                                            Sblocca Pannello
                                        </button>
                                    </form>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center bg-zinc-900 p-4 rounded-xl border border-zinc-800">
                                    <div className="flex items-center gap-2">
                                        <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                                        <span className="text-sm font-semibold text-emerald-400">Staff Connesso</span>
                                    </div>
                                    <button onClick={() => setIsAuthorized(false)} className="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded-lg transition font-medium">
                                        Blocca
                                    </button>
                                </div>

                                {/* Barra Backup & Ripristino Dati */}
                                <div className="bg-zinc-900 border border-zinc-800 p-3 rounded-xl flex items-center justify-between gap-2">
                                    <span className="text-xs text-zinc-400 font-medium pl-1">Salvataggio Dati:</span>
                                    <div className="flex gap-2">
                                        <button 
                                            onClick={exportBackup} 
                                            className="text-xs bg-zinc-800 hover:bg-zinc-700 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-lg transition font-semibold"
                                            title="Scarica un file di backup con tutti i clienti"
                                        >
                                            💾 Esporta Backup
                                        </button>
                                        <label className="text-xs bg-zinc-800 hover:bg-zinc-700 text-emerald-400 border border-emerald-500/30 px-3 py-1.5 rounded-lg transition font-semibold cursor-pointer">
                                            📂 Importa
                                            <input type="file" accept=".json" onChange={importBackup} className="hidden" />
                                        </label>
                                    </div>
                                </div>

                                {/* Form Aggiungi Nuovo Cliente */}
                                <div className="bg-zinc-900 border border-zinc-800 p-4 rounded-xl space-y-3 shadow-lg">
                                    <h3 className="font-semibold text-sm text-amber-500">Registra Nuovo Cliente</h3>
                                    <form onSubmit={handleAddClient} className="space-y-2">
                                        <input 
                                            type="text" 
                                            placeholder="Nome e Cognome" 
                                            value={newClientName}
                                            onChange={(e) => setNewClientName(e.target.value)}
                                            className="w-full bg-black border border-zinc-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-amber-500"
                                        />
                                        <input 
                                            type="tel" 
                                            placeholder="Numero di Telefono (es. 3331234567)" 
                                            value={newClientPhone}
                                            onChange={(e) => setNewClientPhone(e.target.value)}
                                            className="w-full bg-black border border-zinc-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-amber-500"
                                        />
                                        <button type="submit" className="w-full bg-white text-black font-semibold py-2.5 rounded-lg hover:bg-zinc-200 text-sm transition shadow">
                                            + Aggiungi Cliente
                                        </button>
                                    </form>
                                </div>

                                {/* Ricerca Cliente */}
                                <div>
                                    <input 
                                        type="text" 
                                        placeholder="Cerca cliente per nome o telefono..." 
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-amber-500"
                                    />
                                </div>

                                {/* Lista Clienti */}
                                <div className="space-y-4">
                                    {clients
                                        .filter(c => c.name.toLowerCase().includes(searchQuery.toLowerCase()) || c.phone.includes(searchQuery))
                                        .map(client => (
                                            <div key={client.id} className="bg-zinc-900 border border-zinc-800 p-4 rounded-xl space-y-4 shadow">
                                                <div className="flex justify-between items-start gap-2">
                                                    <div>
                                                        <h3 className="font-bold text-base text-white">{client.name}</h3>
                                                        <p className="text-xs text-zinc-400">Tel: {client.phone}</p>
                                                    </div>
                                                    <div className="flex gap-1.5">
                                                        <button 
                                                            onClick={() => sendClientCardWhatsApp(client)}
                                                            className="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1.5 rounded font-semibold transition shadow"
                                                        >
                                                            Invia Tessera WA
                                                        </button>
                                                        <button 
                                                            onClick={() => deleteClient(client.id)}
                                                            className="text-xs bg-red-900/20 text-red-400 border border-red-800/40 px-2 py-1.5 rounded hover:bg-red-900/40 transition"
                                                        >
                                                            Elimina
                                                        </button>
                                                    </div>
                                                </div>

                                                {/* Gestione Timbri */}
                                                <div className="border-t border-zinc-800 pt-3">
                                                    <div className="flex justify-between items-center text-xs mb-2">
                                                        <span className="text-zinc-400">Tessera Fedeltà (Timbri: <strong className="text-amber-500">{client.stamps}/5</strong>)</span>
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <button onClick={() => updateStamps(client.id, -1)} className="bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 rounded text-sm font-bold">-</button>
                                                        <button onClick={() => updateStamps(client.id, 1)} className="flex-1 bg-white text-black hover:bg-zinc-200 py-1.5 rounded text-sm font-semibold">+ Aggiungi Timbro</button>
                                                    </div>
                                                </div>

                                                {/* Gestione Abbonamenti */}
                                                <div className="border-t border-zinc-800 pt-3">
                                                    {client.sub ? (
                                                        <div className="space-y-2">
                                                            <div className="flex justify-between items-center text-xs">
                                                                <span className="font-bold text-amber-500">{client.sub.type} ({client.sub.serviceName})</span>
                                                                <span className="text-zinc-400">Usati: <strong className="text-white">{client.sub.used}</strong> / {client.sub.type === 'Bronze' ? 2 : client.sub.type === 'Silver' ? 4 : 10}</span>
                                                            </div>
                                                            <div className="flex gap-2">
                                                                <button onClick={() => updateSubStamps(client.id, -1)} className="bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 rounded text-sm font-bold">-</button>
                                                                <button onClick={() => updateSubStamps(client.id, 1)} className="flex-1 bg-amber-600 hover:bg-amber-500 text-white py-1.5 rounded text-sm font-semibold">+ Servizio Abbonamento</button>
                                                            </div>
                                                            <button onClick={() => removeSub(client.id)} className="w-full bg-red-900/30 text-red-400 border border-red-800/50 hover:bg-red-900/50 py-1.5 rounded text-xs transition mt-2">
                                                                Termina e Rimuovi Abbonamento
                                                            </button>
                                                        </div>
                                                    ) : (
                                                        <div className="space-y-2">
                                                            <p className="text-xs text-zinc-400">Assegna abbonamento:</p>
                                                            <div className="grid grid-cols-3 gap-2">
                                                                <button onClick={() => assignSub(client.id, 'Bronze', 'Taglio')} className="bg-zinc-800 hover:bg-zinc-700 text-xs py-1.5 rounded font-medium">Bronze</button>
                                                                <button onClick={() => assignSub(client.id, 'Silver', 'Barba')} className="bg-zinc-800 hover:bg-zinc-700 text-xs py-1.5 rounded font-medium">Silver</button>
                                                                <button onClick={() => assignSub(client.id, 'Gold', 'Completo')} className="bg-zinc-800 hover:bg-zinc-700 text-xs py-1.5 rounded font-medium">Gold</button>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        ))
                                    }
                                </div>
                            </div>
                        )}
                    </div>

                    <footer className="text-center pt-8 pb-4 text-[11px] text-zinc-600">
                        Barberia Romana • Uso Riservato
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
